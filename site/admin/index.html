<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · rightroom</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/admin/admin.css">
<script src="/admin/admin.js" defer></script>
</head>
<body>
<svg class="sprite" width="0" height="0" aria-hidden="true">
  <symbol id="rr" viewBox="-4 -4 128 144">
    <path fill="#0057FF" d="M 0 32 L 120 0 L 120 136 L 43 116 L 84 105 L 84 40 L 34 54 L 34 115 L 0 134 Z"/>
  </symbol>
</svg>

<div class="login" id="login" hidden>
  <form id="login-form" autocomplete="off">
    <div class="logo"><svg aria-hidden="true"><use href="#rr"/></svg>rightroom<span class="badge-admin">ADMIN</span></div>
    <h1>Sign in</h1>
    <p class="subtle">Paste your admin key. It stays in this browser tab only and is forgotten when you close it.</p>
    <label for="key">Admin key</label>
    <input id="key" type="password" required minlength="16" autocomplete="off" spellcheck="false">
    <p class="err" id="login-err" role="alert"></p>
    <button class="btn blue btn-full" type="submit">Sign in</button>
  </form>
</div>

<div id="app" hidden>
  <div class="mtop"><span class="logo"><svg aria-hidden="true"><use href="#rr"/></svg>rightroom<span class="badge-admin">ADMIN</span></span><button class="lock" type="button" data-action="lock">Lock</button></div>
  <nav class="mnav" aria-label="Admin sections" data-nav></nav>
  <div class="shell">
    <aside class="side">
      <span class="logo"><svg aria-hidden="true"><use href="#rr"/></svg>rightroom<span class="badge-admin">ADMIN</span></span>
      <nav aria-label="Admin sections" data-nav></nav>
      <div class="foot"><span>Signed in as <b id="who">admin</b></span><button class="lock" type="button" data-action="lock">Lock</button></div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
